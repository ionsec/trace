name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Lint
        run: ruff check src tests

      - name: Test with coverage
        run: python -m pytest -q --cov=ionsec_trace --cov-report=term-missing --cov-fail-under=50

  go:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build
        run: go build ./...
        working-directory: go

      - name: Vet
        run: go vet ./...
        working-directory: go

      - name: Test with coverage
        run: go test ./... -cover -count=1
        working-directory: go
