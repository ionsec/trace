[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ionsec-trace"
version = "1.0.1"
description = "TRACE — Tool for Reconnaissance of AI & Compute Evidence"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "IONSEC", email = "trace@ionsec.io" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    # DeepSeek Harness writes session transcripts as Zstandard frames by
    # default, so reading them is a baseline requirement, not an extra.
    "zstandard>=0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]
iris = [
    "dfir-iris-client>=2.0.0",
]

[project.scripts]
trace = "ionsec_trace.cli:main"

[project.urls]
Homepage = "https://ionsec.io"
Repository = "https://github.com/ionsec/trace"

[tool.hatch.build.targets.wheel]
packages = ["src/ionsec_trace"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# Explicit rule set — the project's quality bar. We select the standard
# pyflakes/pycodestyle/isort/upgrade/import rules plus a curated set of
# bugbear + security checks, and explicitly ignore patterns that are
# intentional in a forensic collection tool (see per-rule notes below).
select = [
    "E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF",
    "S", "PL", "DTZ", "PLC",
]
ignore = [
    # Intentional: collectors declare mutable class-level path lists.
    "RUF012",
    # Intentional: a forensic tool must never crash on a single unreadable
    # file — broad excepts are deliberate and logged/continued.
    "BLE001", "S110", "S112",
    # Intentional: subprocess calls check ReturnCode explicitly.
    "PLW1510",
    # False positives: naive datetimes are parsed then explicitly set to UTC.
    "DTZ007",
    # Intentional: multi-char strip for path normalization.
    "B005",
    # Intentional: SQL is built from SQLite schema introspection (table/column
    # names), never from untrusted input.
    "S608",
    # Intentional: subprocess invokes fixed, known binary names (ollama, docker,
    # etc.) — not untrusted input.
    "S603", "S607",
    # Intentional: forensic tool writes to /tmp and binds localhost for
    # inspection; these are not production services.
    "S108", "S104",
    # False positive: keyword-arg name, not a hardcoded password.
    "S106",
    # Intentional: STIX/JSON report strings are long by nature.
    "E501",
    # Intentional: forensic thresholds and severity cutoffs are magic values.
    "PLR2004",
    # Intentional: complex forensic functions legitimately exceed these limits.
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917",
    # Intentional: lazy imports inside functions avoid heavy module loads.
    "PLC0415",
    # Intentional: loop variables reused across report sections.
    "PLW2901",
    # Intentional: unicode in forensic strings (e.g. box-drawing chars).
    "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Security/bandit rules (S) and magic-value checks (PLR2004) are for
# production code only — tests legitimately use assert, random, and /tmp.
"tests/*" = ["S101", "S108", "S311", "PLR2004"]